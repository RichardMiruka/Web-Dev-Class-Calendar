<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Curriculum Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --border: #2a2a35;
    --accent: #7c5cfc;
    --accent2: #fc5c7d;
    --accent3: #5cf4a0;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --week1: #7c5cfc;
    --week2: #fc5c7d;
    --week3: #5cf4a0;
    --week4: #fcb95c;
    --week5: #5ccffc;
    --week6: #e05cfc;
    --week7: #fc5c5c;
    --break: #4a4a5a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 40px 20px;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at 30% 20%, rgba(124,92,252,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(252,92,125,0.06) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  header {
    text-align: center;
    margin-bottom: 56px;
    animation: fadeDown 0.6s ease both;
  }

  .badge {
    display: inline-block;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid rgba(124,92,252,0.4);
    padding: 6px 16px;
    border-radius: 2px;
    margin-bottom: 20px;
  }

  h1 {
    font-size: clamp(32px, 6vw, 64px);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -1px;
  }

  h1 span {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    margin-top: 12px;
    letter-spacing: 1px;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 44px;
    animation: fadeUp 0.6s 0.2s ease both;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 4px;
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .months-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 32px;
  }

  .month-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    animation: fadeUp 0.6s ease both;
  }

  .month-header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 1px;
    background: rgba(255,255,255,0.02);
  }

  .day-labels {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    padding: 12px 16px 8px;
    gap: 4px;
  }

  .day-label {
    text-align: center;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    padding: 0 16px 20px;
    gap: 4px;
  }

  .day {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    position: relative;
    cursor: default;
    transition: transform 0.15s ease;
    min-height: 40px;
  }

  .day:hover .tooltip {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .day.active:hover {
    transform: scale(1.1);
    z-index: 10;
  }

  .day-num {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
  }

  .day.empty { opacity: 0; pointer-events: none; }

  .day.other-month .day-num { color: var(--muted); opacity: 0.3; }

  .day.active {
    border-radius: 6px;
  }

  .day.active .day-num { color: #fff; }

  .day.break-day {
    background: rgba(74,74,90,0.3);
    border: 1px dashed rgba(74,74,90,0.6);
  }

  .dot-row {
    display: flex;
    gap: 2px;
    margin-top: 3px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 28px;
  }

  .dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .tooltip {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%) translateY(4px);
    background: #1e1e28;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    min-width: 160px;
    max-width: 200px;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  .tooltip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: var(--border);
  }

  .tooltip-week {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .tooltip-topics {
    list-style: none;
  }

  .tooltip-topics li {
    font-size: 11px;
    color: var(--text);
    padding: 2px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .tooltip-topics li:last-child { border-bottom: none; }

  .tooltip-topics li::before {
    content: '';
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }

  .week-cards {
    margin-top: 48px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    animation: fadeUp 0.6s 0.4s ease both;
  }

  .week-card {
    border-radius: 10px;
    padding: 20px;
    border: 1px solid rgba(255,255,255,0.06);
    position: relative;
    overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .week-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.3);
  }

  .week-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }

  .week-card .wk-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 4px;
    opacity: 0.7;
  }

  .week-card .wk-dates {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 14px;
    color: var(--text);
  }

  .week-card .topics {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .week-card .topics li {
    font-size: 13px;
    padding: 6px 10px;
    background: rgba(255,255,255,0.04);
    border-radius: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .week-card .topics li::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .week-card.break-card {
    border-style: dashed;
    opacity: 0.7;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 600px) {
    .months-grid { grid-template-columns: 1fr; }
    .day-num { font-size: 10px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="badge">freeCodeCamp · CSS Curriculum</div>
    <h1>Web Dev <span>CSS</span><br>Schedule</h1>
    <p class="subtitle">March 2025 — May 2026 · 8 Weeks</p>
  </header>

  <div class="legend" id="legend"></div>
  <div class="months-grid" id="calendar"></div>
  <div class="week-cards" id="weekCards"></div>
</div>

<script>
const weeks = [
  {
    id: 1,
    label: "Week 1",
    color: "#7c5cfc",
    dates: "Mon 9th – Sat 14th March",
    start: new Date(2026, 2, 9),
    end: new Date(2026, 2, 14),
    topics: ["Basic CSS", "Design", "Absolute & Relative Units", "Pseudo Classes & Elements"]
  },
  {
    id: 2,
    label: "Week 2",
    color: "#fc5c7d",
    dates: "Mon 16th – Thu 19th March",
    start: new Date(2026, 2, 16),
    end: new Date(2026, 2, 19),
    topics: ["Colors", "Styling Forms", "Box Model"]
  },
  {
    id: 3,
    label: "Week 3",
    color: "#5cf4a0",
    dates: "Mon 23rd – Sat 28th March",
    start: new Date(2026, 2, 23),
    end: new Date(2026, 2, 28),
    topics: ["Flexbox", "Typography", "Accessibility"]
  },
  {
    id: 4,
    label: "Week 4",
    color: "#fcb95c",
    dates: "Mon 30th March – Fri 4th April",
    start: new Date(2026, 2, 30),
    end: new Date(2026, 3, 4),
    topics: ["Positioning", "Attribute Selectors", "Responsive Design"]
  },
  {
    id: 5,
    label: "Week 5",
    color: "#5ccffc",
    dates: "Tue 7th – Sat 11th April",
    start: new Date(2026, 3, 7),
    end: new Date(2026, 3, 11),
    topics: ["Variables"]
  },
  {
    id: 6,
    label: "Week 6",
    color: "#e05cfc",
    dates: "Mon 13th – Sat 18th April",
    start: new Date(2026, 3, 13),
    end: new Date(2026, 3, 18),
    topics: ["Grid"]
  },
  {
    id: 7,
    label: "Week 7",
    color: "#fc5c5c",
    dates: "Mon 20th – Sat 25th April",
    start: new Date(2026, 3, 20),
    end: new Date(2026, 3, 25),
    topics: ["Animations", "CSS Review"]
  },
  {
    id: "break",
    label: "Break",
    color: "#4a4a5a",
    dates: "Mon 27th April – Sat 2nd May",
    start: new Date(2026, 3, 27),
    end: new Date(2026, 4, 2),
    topics: ["Short Break 🎉"],
    isBreak: true
  },
  {
    id: "resume",
    label: "Resumption",
    color: "#5cf4a0",
    dates: "Monday 4th May 2026",
    start: new Date(2026, 4, 4),
    end: new Date(2026, 4, 4),
    topics: ["Classes Resume"],
    isResume: true
  }
];

function getWeekForDate(date) {
  return weeks.find(w => date >= w.start && date <= w.end);
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

// Legend
const legend = document.getElementById('legend');
weeks.filter(w => !w.isResume).forEach(w => {
  legend.innerHTML += `
    <div class="legend-item">
      <div class="legend-dot" style="background:${w.color}"></div>
      ${w.label}${!w.isBreak ? ': ' + (w.topics.length > 1 ? w.topics[0] + '…' : w.topics[0]) : ''}
    </div>`;
});

// Calendar months: March, April, May
const monthsToShow = [
  { year: 2026, month: 2, name: "March 2026" },
  { year: 2026, month: 3, name: "April 2026" },
  { year: 2026, month: 4, name: "May 2026" },
];

const calEl = document.getElementById('calendar');
const DAY_LABELS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

monthsToShow.forEach((m, mi) => {
  const block = document.createElement('div');
  block.className = 'month-block';
  block.style.animationDelay = `${0.1 + mi * 0.1}s`;

  let html = `<div class="month-header">${m.name}</div>`;
  html += `<div class="day-labels">${DAY_LABELS.map(d => `<div class="day-label">${d}</div>`).join('')}</div>`;
  html += `<div class="days-grid">`;

  const firstDay = new Date(m.year, m.month, 1).getDay();
  const daysInMonth = new Date(m.year, m.month + 1, 0).getDate();
  const daysInPrev = new Date(m.year, m.month, 0).getDate();

  // Prev month padding
  for (let i = 0; i < firstDay; i++) {
    const d = daysInPrev - firstDay + 1 + i;
    html += `<div class="day other-month"><span class="day-num">${d}</span></div>`;
  }

  // Current month days
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(m.year, m.month, d);
    const week = getWeekForDate(date);

    if (week) {
      const rgb = hexToRgb(week.color);
      const isBreak = week.isBreak;
      const dotsHtml = !isBreak ? week.topics.map(t =>
        `<div class="dot" style="background:${week.color}"></div>`
      ).join('') : '';

      const topicsHtml = week.topics.map(t =>
        `<li style="color:${week.color}">${t}</li>`
      ).join('');

      html += `
        <div class="day active" style="background:rgba(${rgb},0.15); border:1px solid rgba(${rgb},0.35);">
          <span class="day-num">${d}</span>
          <div class="dot-row">${dotsHtml}</div>
          <div class="tooltip">
            <div class="tooltip-week" style="color:${week.color}">${week.label} · ${week.dates}</div>
            <ul class="tooltip-topics">${topicsHtml}</ul>
          </div>
        </div>`;
    } else {
      html += `<div class="day"><span class="day-num" style="color:#4a4a5a">${d}</span></div>`;
    }
  }

  // Next month padding
  const totalCells = firstDay + daysInMonth;
  const remainder = totalCells % 7;
  if (remainder !== 0) {
    for (let i = 1; i <= 7 - remainder; i++) {
      html += `<div class="day other-month"><span class="day-num">${i}</span></div>`;
    }
  }

  html += `</div>`;
  block.innerHTML = html;
  calEl.appendChild(block);
});

// Week cards
const cardsEl = document.getElementById('weekCards');
weeks.forEach((w, i) => {
  const rgb = hexToRgb(w.color);
  const card = document.createElement('div');
  card.className = 'week-card' + (w.isBreak ? ' break-card' : '');
  card.style.background = `rgba(${rgb},0.06)`;
  card.style.animationDelay = `${0.5 + i * 0.06}s`;
  card.innerHTML = `
    <div style="position:absolute;top:0;left:0;right:0;height:3px;background:${w.color};border-radius:10px 10px 0 0"></div>
    <div class="wk-label" style="color:${w.color}">${w.label}</div>
    <div class="wk-dates">${w.dates}</div>
    <ul class="topics">
      ${w.topics.map(t => `<li style="--c:${w.color}"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${w.color};flex-shrink:0"></span>${t}</li>`).join('')}
    </ul>`;
  cardsEl.appendChild(card);
});
</script>
</body>
</html>
